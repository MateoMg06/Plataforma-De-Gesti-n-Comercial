# HU-INF-03: nginx en EC2. Copiar a /etc/nginx/sites-available/comercial360.
# - El frontend compilado se sirve desde /var/www/comercial360.
# - /api pasa al backend (pm2, puerto 3000), que no se abre a Internet.
# Frontend y API quedan en la misma dirección: la cookie de sesión funciona sin CORS.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/comercial360;
    index index.html;

    # HU-29: los documentos de cotización pesan hasta 10 MB.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta del frontend devuelve index.html.
    location / {
        try_files $uri /index.html;
    }
}
