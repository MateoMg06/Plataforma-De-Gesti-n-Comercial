sonar.projectKey=comercial360
sonar.projectName=Comercial 360
sonar.projectVersion=1.0

# Fuentes
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts

# Cobertura (Vitest genera lcov en backend/coverage/lcov.info)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Lenguaje
sonar.sourceEncoding=UTF-8