# Solo para desarrollo local. En AWS se usa RDS (HU-INF-02).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: comercial
      POSTGRES_PASSWORD: comercial
      POSTGRES_DB: comercial360
    ports:
      # Si ya tienes otro PostgreSQL en el 5432, pon DB_PORT=5434 en el .env de la raíz y de backend/.
      - '${DB_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
